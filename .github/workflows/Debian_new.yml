
name: Build Debian Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-deb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dkms \
            dh-dkms \
            devscripts

      - name: Build package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Collect Debian packages
        run: |
          mkdir -p artifacts
          shopt -s nullglob
          debs=(../*.deb)

          if [ ${#debs[@]} -eq 0 ]; then
            echo "ERROR: No Debian packages were generated"
            exit 1
          fi

          cp "${debs[@]}" artifacts/
          ls -lh artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gspca-aveo-deb
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 30
