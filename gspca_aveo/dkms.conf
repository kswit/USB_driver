PACKAGE_NAME="gspca_aveo"
PACKAGE_VERSION="1.0"

BUILT_MODULE_NAME[0]="gspca_aveo"
DEST_MODULE_LOCATION[0]="/kernel/drivers/media/usb/gspca"

# Budowanie przez własny Makefile modułu (uruchamiany w katalogu źródłowym DKMS).
# Makefile używa KERNELRELEASE z DKMS, aby budować dla NOWEGO jądra podczas
# aktualizacji jądra.
# Build via the module's own Makefile (run in the DKMS source build dir).
# The Makefile uses the DKMS-provided KERNELRELEASE to target the NEW kernel
# being installed during a kernel update.
MAKE[0]="make"
CLEAN="make clean"

AUTOINSTALL="yes"
